<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Face Recognition Attendance System</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Face Recognition Attendance System</h1>
        <p>Smart & Automatic Attendance Management</p>
    </header>


    <!-- Main Container -->
    <main class="container">

        <div class="dashboard">

            <!-- Camera Card -->
            <section class="card">

                <h2>Face Recognition</h2>

                <div class="camera-box">
                    <video id="camera" autoplay playsinline></video>
                </div>

                <div class="buttons">
                    <button id="startCameraBtn">
                        Start Camera
                    </button>

                    <button id="stopCameraBtn">
                        Stop Camera
                    </button>

                    <button id="attendanceBtn">
                        Mark Attendance
                    </button>
                </div>

            </section>


            <!-- Student Details Card -->
            <section class="card">

                <h2>Student Details</h2>

                <div class="details">

                    <p>
                        <strong>Name:</strong>
                        <span id="studentName">Not Detected</span>
                    </p>

                    <p>
                        <strong>Student ID:</strong>
                        <span id="studentId">---</span>
                    </p>

                    <p>
                        <strong>Date:</strong>
                        <span id="date">---</span>
                    </p>

                    <p>
                        <strong>Time:</strong>
                        <span id="time">---</span>
                    </p>

                    <p>
                        <strong>Status:</strong>

                        <span
                            id="status"
                            class="status waiting">
                            Waiting
                        </span>
                    </p>

                </div>

            </section>

        </div>


        <!-- Attendance Records -->
        <section class="attendance-section">

            <h2>Attendance Records</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceTable">

                        <!-- Attendance records will be added here -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>
            © 2026 Face Recognition Attendance System
        </p>
    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
